<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JTown Flyer Tracker</title>
<link rel="stylesheet" href="https://js.arcgis.com/4.34/esri/themes/light/main.css">
<style>
html,body,#view{margin:0;padding:0;width:100%;height:100%;font-family:Arial,sans-serif}
body{overflow:hidden}
#top{position:absolute;z-index:20;top:12px;left:12px;right:12px;max-width:560px;background:#fff;border-radius:16px;box-shadow:0 3px 16px #0003;padding:12px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}.row:last-child{margin-bottom:0}
input,button,select{font-size:18px;border:1px solid #bbb;border-radius:10px;padding:10px}
input{flex:1;min-width:0}button{background:#fff;cursor:pointer;font-weight:700}
.primary{background:#1769aa;color:#fff;border:0}.orange{background:#fff0e0;border:2px solid #f07800;color:#a84d00}
.hint{font-size:15px;color:#555}.status{padding:7px 9px;border-radius:9px;background:#f4f4f4;font-size:14px}
.swatch{width:22px;height:22px;border-radius:50%;border:1px solid #333;display:inline-block}
.searchResults{position:absolute;left:12px;right:12px;top:116px;max-width:560px;background:#fff;z-index:25;border-radius:12px;box-shadow:0 3px 16px #0004;overflow:hidden}
.result{padding:13px 15px;font-size:18px;border-bottom:1px solid #ddd;cursor:pointer}.result:last-child{border:0}
.sheet{position:absolute;z-index:30;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -4px 18px #0003;padding:18px;display:none}
.sheet h2{margin:0 0 10px}.choices{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.choice{padding:13px 6px;text-align:center}.choice.selected{outline:4px solid #1769aa}
.counter{display:flex;gap:10px;align-items:center}.counter button{width:55px;font-size:26px}
.big{font-size:22px;font-weight:700}.footer{display:flex;gap:8px;margin-top:12px}.footer button{flex:1}
.name{font-weight:700}.hidden{display:none}
@media(max-width:520px){.choices{grid-template-columns:1fr}.row{flex-wrap:wrap}.row button{flex:1}.searchResults{top:154px}}
</style>
</head>
<body>
<div id="view"></div>

<div id="top">
  <div class="row">
    <input id="name" placeholder="Your name">
    <select id="color" title="Your color">
      <option value="#1769aa">Blue</option><option value="#d22">Red</option>
      <option value="#159447">Green</option><option value="#8b4dcc">Purple</option>
      <option value="#ef8c00">Orange</option>
    </select>
    <span class="swatch" id="swatch"></span>
  </div>
  <div class="row">
    <input id="streetSearch" placeholder="Find a street…" autocomplete="off">
    <button class="primary" id="searchBtn">Find</button>
  </div>
  <div class="row">
    <button class="orange" id="areaBtn">Show Work Area</button>
    <button id="gpsBtn">📍 Find Me</button>
    <button id="refreshBtn">↻ Refresh</button>
  </div>
  <div class="hint">Tap the map where you worked. The street name will fill in automatically.</div>
  <div class="status" id="status">Loading map…</div>
</div>

<div id="results" class="searchResults hidden"></div>

<div class="sheet" id="sheet">
  <h2>Record this work</h2>
  <div class="name" id="streetLabel">Street</div>
  <div class="row"><label>Status:</label></div>
  <div class="choices">
    <button class="choice" data-status="mostly">Mostly done</button>
    <button class="choice" data-status="partial">Partial</button>
    <button class="choice" data-status="couldnt">Couldn't / didn't</button>
  </div>
  <div class="row" style="margin-top:12px">
    <span class="big">Houses missed</span>
    <div class="counter"><button id="minus">−</button><span class="big" id="missed">0</span><button id="plus">+</button></div>
  </div>
  <label class="row"><input type="checkbox" id="complete" style="flex:0;width:22px;height:22px"> Street completed</label>
  <div class="footer"><button id="cancel">Cancel</button><button class="primary" id="save">SAVE</button></div>
</div>

<script src="https://js.arcgis.com/4.34/"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
require([
  "esri/Map","esri/views/MapView","esri/layers/TileLayer",
  "esri/layers/FeatureLayer","esri/layers/GraphicsLayer","esri/Graphic",
  "esri/geometry/Point","esri/geometry/geometryEngine",
  "esri/geometry/support/webMercatorUtils"
], function(Map,MapView,TileLayer,FeatureLayer,GraphicsLayer,Graphic,Point,geometryEngine,webMercatorUtils){

const SUPABASE_URL='https://ybwqrcloxvusfvnmzztg.supabase.co';
const SUPABASE_KEY='sb_publishable_qxNMFKHrMNfif5k8INoKiQ_GCcw8OEW';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const streetUrl='https://gis.lojic.org/maps/rest/services/LojicSolutions/OpenDataAddresses/MapServer/1';
const boundaryUrl='https://services.lojic.org/arcgis/rest/services/Lojic/StreetMapBasic/MapServer/34';

const base=new TileLayer({
  url:'https://services.lojic.org/arcgis/rest/services/Lojic/StreetMapBasic/MapServer',
  title:'LOJIC Streets'
});

const boundary=new FeatureLayer({
  url:boundaryUrl,title:'Work Area',definitionExpression:"NAME = 'Jeffersontown'",
  outFields:['NAME'],renderer:{
    type:'simple',
    symbol:{
      type:'simple-fill',color:[255,140,0,0.03],
      outline:{color:[255,110,0,1],width:3,style:'dash'}
    }
  },popupEnabled:false
});

const street=new FeatureLayer({
  url:streetUrl,title:'Street Centerlines',
  outFields:['ROADNAME'],popupEnabled:false,visible:false
});

const pins=new GraphicsLayer({title:'Work Pins'});
const gpsLayer=new GraphicsLayer({title:'GPS'});
const streetHighlight=new GraphicsLayer({title:'Selected Street'});

const map=new Map({layers:[base,boundary,streetHighlight,pins,gpsLayer,street]});

const view=new MapView({
  container:'view',map,spatialReference:{wkid:2246},
  center:[1170000,360000],zoom:10,
  constraints:{minZoom:7,maxZoom:18}
});

const $=id=>document.getElementById(id);
const status=t=>$('status').textContent=t;
let current=null,selectedStatus='mostly',missed=0;

$('color').onchange=()=>{$('swatch').style.background=$('color').value};
$('swatch').style.background=$('color').value;

function toWgs(p){return webMercatorUtils.webMercatorToGeographic(p)}
function toMap(p){return webMercatorUtils.geographicToWebMercator(p)}

function drawGps(lat,lon){
  gpsLayer.removeAll();
  gpsLayer.add(new Graphic({
    geometry:new Point({latitude:lat,longitude:lon}),
    symbol:{type:'simple-marker',style:'circle',color:'#1677ff',size:16,outline:{color:'#fff',width:3}}
  }));
}

async function loadArea(){
  try{
    await boundary.load();
    const q=boundary.createQuery();
    q.where="NAME = 'Jeffersontown'";
    q.returnGeometry=true;q.outFields=['NAME'];
    const r=await boundary.queryFeatures(q);
    if(!r.features.length)throw Error('No boundary');
    await view.goTo(r.features[0].geometry.expand(1.12));
    status('Work area is shown in orange.');
  }catch(e){
    console.error(e);
    status('Map loaded. Work area outline could not be loaded.');
  }
}

async function loadPins(){
  pins.removeAll();
  try{
    const {data,error}=await sb.from('flyer_entries').select('*').order('created_at',{ascending:true});
    if(error)throw error;
    (data||[]).forEach(addPin);
  }catch(e){
    console.error(e);
    status('Map loaded, but saved pins could not be loaded.');
  }
}

function addPin(x){
  if(x.latitude==null||x.longitude==null)return;
  const g=new Graphic({
    geometry:new Point({latitude:x.latitude,longitude:x.longitude}),
    symbol:{type:'simple-marker',style:'circle',color:x.worker_color||'#1769aa',size:13,outline:{color:'#fff',width:2}},
    attributes:x,
    popupTemplate:{
      title:x.street_name||'Work',
      content:`<b>${x.worker_name||''}</b><br>${x.status||''}<br>Houses missed: ${x.houses_missed||0}`
    }
  });
  pins.add(g);
}

async function nearestStreet(point){
  const q=street.createQuery();
  q.geometry=point;q.distance=250;q.units='feet';
  q.spatialRelationship='intersects';
  q.returnGeometry=true;q.outFields=['ROADNAME'];q.num=25;
  const r=await street.queryFeatures(q);
  if(!r.features.length)return '';
  let best=r.features[0],bd=Infinity;
  for(const f of r.features){
    if(!f.geometry)continue;
    try{
      const n=geometryEngine.nearestCoordinate(f.geometry,point);
      if(n&&n.distance<bd){bd=n.distance;best=f}
    }catch{}
  }
  return best.attributes.ROADNAME||'';
}

async function highlight(f){
  streetHighlight.removeAll();
  if(!f||!f.geometry)return;
  streetHighlight.add(new Graphic({
    geometry:f.geometry,
    symbol:{type:'simple-line',color:'#ff7a00',width:5,style:'solid'}
  }));
  try{await view.goTo({target:f.geometry,scale:6000},{duration:500})}catch{}
}

async function searchStreet(){
  const qtext=$('streetSearch').value.trim();
  if(!qtext){$('results').classList.add('hidden');return}
  status('Finding street…');
  try{
    const q=street.createQuery();
    q.where=`ROADNAME LIKE '%${qtext.replace(/'/g,"''")}%'`;
    q.returnGeometry=true;q.outFields=['ROADNAME'];q.num=12;
    const r=await street.queryFeatures(q);
    const box=$('results');box.innerHTML='';
    if(!r.features.length){
      box.innerHTML='<div class="result">No street found</div>';
      box.classList.remove('hidden');status('No street found.');return;
    }
    const seen=new Set();
    r.features.forEach(f=>{
      const n=f.attributes.ROADNAME;
      if(!n||seen.has(n))return;
      seen.add(n);
      const d=document.createElement('div');
      d.className='result';d.textContent=n;
      d.onclick=async()=>{
        box.classList.add('hidden');
        $('streetSearch').value=n;
        await highlight(f);
        status('Street found.\\nTap the map to record work.');
      };
      box.appendChild(d);
    });
    box.classList.remove('hidden');status('Choose a street.');
  }catch(e){
    console.error(e);
    status('Street search could not connect.');
  }
}

$('searchBtn').onclick=searchStreet;
$('streetSearch').addEventListener('keydown',e=>{if(e.key==='Enter')searchStreet()});

view.on('click',async ev=>{
  try{
    const p=ev.mapPoint;
    const name=await nearestStreet(p);
    current={point:p,street:name||$('streetSearch').value.trim()||'Unknown street'};
    $('streetLabel').textContent=current.street;
    missed=0;$('missed').textContent='0';selectedStatus='mostly';
    document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('selected',b.dataset.status==='mostly'));
    $('complete').checked=false;$('sheet').style.display='block';
    status(name?'Street found automatically.':'Street name not found; you can still record it.');
  }catch(e){console.error(e)}
});

document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
  selectedStatus=b.dataset.status;
  document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));
  b.classList.add('selected');
});

$('plus').onclick=()=>{$('missed').textContent=++missed};
$('minus').onclick=()=>{missed=Math.max(0,missed-1);$('missed').textContent=missed};
$('cancel').onclick=()=>{$('sheet').style.display='none'};

$('save').onclick=async()=>{
  const nm=$('name').value.trim();
  if(!nm){alert('Please enter your name first.');return}
  if(!current){alert('Tap the map first.');return}
  const g=current.point,geo=toWgs(g);
  const row={
    worker_name:nm,worker_color:$('color').value,street_name:current.street,
    latitude:geo.y,longitude:geo.x,status:selectedStatus,
    houses_missed:missed,street_completed:$('complete').checked
  };
  const {data,error}=await sb.from('flyer_entries').insert(row).select().single();
  if(error){console.error(error);alert('Could not save this entry.');return}
  addPin(data);$('sheet').style.display='none';
  status('Saved.\\nYour pin is on the map.');
};

$('gpsBtn').onclick=()=>navigator.geolocation.getCurrentPosition(async pos=>{
  drawGps(pos.coords.latitude,pos.coords.longitude);
  const p=toMap({
    type:'point',x:pos.coords.longitude,y:pos.coords.latitude,
    spatialReference:{wkid:4326}
  });
  await view.goTo({target:p,zoom:15},{duration:600});
  const n=await nearestStreet(p);
  if(n)$('streetSearch').value=n;
  status(n?'You are on '+n+'.':'Your location is shown.');
},err=>alert('Please allow location access in your browser.'),{
  enableHighAccuracy:true,maximumAge:10000,timeout:15000
});

$('areaBtn').onclick=loadArea;
$('refreshBtn').onclick=loadPins;

sb.channel('flyer_entries_changes')
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'flyer_entries'},p=>addPin(p.new))
  .subscribe();

view.when(async()=>{
  status('Map ready. Loading work area and pins…');
  await loadArea();
  await loadPins();
});
});
</script>
</body>
</html>
